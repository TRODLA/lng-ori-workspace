apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: lng-ori-workspace
spec:
  environments:
    - name: dev
      build:
        from: copilot-dev
    - name: prod
      build:
        from: main
  components:
    - name: dashapp
      src: "."
      authentication:
        oauth2:
          clientId: "681c8b9e-27ff-4f18-805e-8daa750a4466"
          scope: "openid profile email offline_access"
          setXAuthRequestHeaders: true
          setAuthorizationHeader: true
          sessionStoreType: systemManaged
      public: true
      ports:
        - name: http
          port: 8501
      publicPort: http
      variables:
        AZURE_TENANT_ID: "3aa4a235-b6e2-48d5-9195-7fcf05b459b0"
        AZURE_CLIENT_ID: "44d1d850-39c8-4be0-9d31-954cb9c3aceb"
        AZURE_STORAGE_ACCOUNT_NAME: "gplngplabqizrlz"
        AZURE_STORAGE_CONTAINER_NAME: "landingzone"
        AZURE_STORAGE_BASE_DIRECTORY: "origination"
      secrets:
        - AZURE_CLIENT_SECRET
      environmentConfig:
        - environment: dev
          replicas: 1
          authentication:
            oauth2:
              scope: "openid profile email offline_access https://api.powerplatform.com/.default"
          variables:
            COPILOT_ENABLED: "true"
            COPILOT_CONNECTION_STRING: "https://7adc1300acf5ed298ce9089ddb02b0.58.environment.api.powerplatform.com/copilotstudio/agenticruntime/3p/dataverse-backed/authenticated/bots/cr090_lngoriagenta_hkxJTg/conversations?api-version=2022-03-01-preview"
            ALLOWED_HOSTS: "dashapp-lng-ori-workspace-dev.radix.equinor.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "200m"
        - environment: prod
          replicas: 2
          variables:
            COPILOT_ENABLED: "false"
            ALLOWED_HOSTS: "dashapp-lng-ori-workspace-prod.radix.equinor.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "200m"

    - name: teamsfeed
      src: "."
      dockerfileName: Dockerfile.teamsfeed
      public: true
      ports:
        - name: http
          port: 8080
      publicPort: http
      variables:
        AZURE_TENANT_ID: "3aa4a235-b6e2-48d5-9195-7fcf05b459b0"
        AZURE_CLIENT_ID: "44d1d850-39c8-4be0-9d31-954cb9c3aceb"
        AZURE_STORAGE_ACCOUNT_NAME: "gplngplabqizrlz"
        AZURE_STORAGE_CONTAINER_NAME: "landingzone"
        AZURE_STORAGE_BASE_DIRECTORY: "origination"
        DATABRICKS_AI_GATEWAY_URL: "https://adb-10232102388343247.7.azuredatabricks.net/ai-gateway/mlflow/v1/responses"
        DATABRICKS_AI_MODEL: "system.ai.claude-haiku-5-5"
        DATABRICKS_TIMEOUT_SECONDS: "45"
      secrets:
        - AZURE_CLIENT_SECRET
        - TEAMS_FEED_INGEST_SECRET
        - DATABRICKS_TOKEN
      environmentConfig:
        - environment: dev
          replicas: 1
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
        - environment: prod
          replicas: 1
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
